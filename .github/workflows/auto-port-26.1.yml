name: Auto-port TFC to 26.1

on:
  push:
    branches:
      - port/26.1-neoforge

permissions:
  contents: write

jobs:
  porter:
    if: ${{ !contains(github.event.head_commit.message, '[auto-port]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Prepare clean 1.21.1 source
        run: |
          git fetch origin 1.21.x
          git worktree add --detach /tmp/tfc-source origin/1.21.x

      - name: Download MC Mod Porter
        run: |
          curl -fL --retry 3 -o /tmp/auto-porter.jar \
            https://github.com/reqsery/mc-mod-porter/releases/download/v1.2.0-beta/auto-porter-1.2.0-beta.jar

      - name: Run MC Mod Porter
        run: |
          java -jar /tmp/auto-porter.jar /tmp/tfc-source 1.21.1 26.1.2
          PORTED="/tmp/tfc-source-ported-26_1_2"
          test -d "$PORTED"
          cp -a "$PORTED"/. "$GITHUB_WORKSPACE"/
          rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Restore git metadata and inspect result
        run: |
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch origin port/26.1-neoforge
          git checkout -B port/26.1-neoforge FETCH_HEAD
          git status --short
          test -f port-report.json || true

      - name: Commit porter pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-port TFC 1.21.1 to 26.1.2 [auto-port]" || exit 0
          git push origin HEAD:port/26.1-neoforge
